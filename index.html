<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ryan's personal site for basketball, mathematics, and One Piece.">
  <title>Ryan | Basketball, Mathematics and One Piece</title>
  <style>
    :root { --ink:#090909; --paper:#f5f3ee; --quiet:#b9b7b1; --line:#2c2c2a; --red:#ba211d; --orange:#e87831; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--ink); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    a { color:inherit; text-decoration:none; }
    .page { width:min(1320px, calc(100% - 28px)); margin:14px auto; overflow:hidden; background:var(--paper); }
    .nav { display:flex; justify-content:space-between; align-items:center; padding:20px 30px; font-size:.68rem; font-weight:700; letter-spacing:.05em; }
    .brand { font-size:1rem; letter-spacing:-.06em; } .nav-links { display:flex; gap:26px; color:#545450; } .nav-links a:hover { color:var(--red); }
    .hero { position:relative; min-height:650px; overflow:hidden; padding:28px 30px; }
    .eyebrow,.section-label { font-size:.67rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .eyebrow { position:relative; z-index:3; }
    .hero h1 { position:relative; z-index:3; max-width:1000px; margin:24px 0 0; font-size:clamp(4rem, 12.6vw, 11.6rem); font-weight:800; letter-spacing:-.105em; line-height:.77; text-transform:uppercase; }
    .hero h1 span { color:transparent; -webkit-text-stroke:2px var(--ink); }
    .hero-copy { position:relative; z-index:3; max-width:270px; margin:34px 0 0; font-size:.85rem; line-height:1.5; }
    .court { position:absolute; z-index:1; inset:145px 9% 0 32%; display:grid; place-items:center; background:linear-gradient(135deg,#d4d3ce,#fff 50%,#d9d8d4); }
    .court::before { content:""; position:absolute; width:min(405px, 42vw); aspect-ratio:1; border:11px solid var(--ink); border-radius:50%; }
    .court::after { content:""; position:absolute; width:130%; height:1px; background:var(--ink); transform:rotate(-21deg); }
    .ball { position:relative; z-index:2; width:min(298px, 39vw); aspect-ratio:1; border:9px solid var(--ink); border-radius:50%; background:var(--orange); box-shadow:18px 22px 0 rgba(0,0,0,.16); overflow:hidden; }
    .ball svg { width:100%; height:100%; display:block; }
    .ball path { fill:none; stroke:var(--ink); stroke-width:1.5; stroke-linecap:round; }
    .hero-note { position:absolute; z-index:3; right:7%; bottom:42px; max-width:205px; font-size:.72rem; line-height:1.45; }
    .hero-note b { display:block; margin-bottom:7px; font-size:1rem; letter-spacing:-.05em; }
    .section { padding:80px 30px; border-top:1px solid var(--line); }
    .split { display:grid; grid-template-columns:1fr 2fr; gap:42px; }
    .section h2 { margin:0; font-size:clamp(2rem,4vw,4rem); letter-spacing:-.08em; line-height:.9; }
    .about-copy { max-width:650px; margin:0; font-size:clamp(1.2rem,2vw,1.7rem); line-height:1.35; letter-spacing:-.04em; }
    .interest-grid { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); }
    .interest { min-height:270px; padding:23px; border-right:1px solid var(--line); } .interest:last-child { border-right:0; }
    .interest-number { display:block; margin-bottom:58px; color:#686762; font-size:.68rem; font-weight:700; } .interest h3 { margin:0 0 12px; font-size:1.5rem; letter-spacing:-.06em; }
    .interest p,.work-card p,.weekly p,.opportunity p { margin:0; color:#55544f; font-size:.85rem; line-height:1.55; }
    .interest-icon { float:right; display:grid; width:46px; height:46px; place-items:center; color:var(--red); }
    .interest-icon svg { width:46px; height:46px; overflow:visible; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .interest-icon .hat-band { fill:currentColor; stroke:none; }
    .work-card { display:grid; grid-template-columns:1fr 2fr; gap:30px; padding:36px; background:var(--ink); color:var(--paper); }
    .work-card p { color:#c5c3bd; max-width:520px; font-size:1rem; } .work-card .section-label { color:#c5c3bd; } .work-card h2 { margin-bottom:14px; }
    .following-list { list-style:none; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:0; margin:0; }
    .following-list li { padding:20px; border:1px solid #8e8c85; font-size:.9rem; line-height:1.35; }
    .weekly { display:grid; grid-template-columns:1fr 2fr; gap:42px; background:var(--red); color:var(--paper); }
    .weekly .section-label,.weekly p { color:#f4d8d5; } .weekly h2 { margin-bottom:16px; } .weekly p { max-width:590px; font-size:1.1rem; }
    .opportunity-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .opportunity { min-height:190px; padding:24px; border:1px solid var(--line); } .opportunity h3 { margin:42px 0 12px; font-size:1.35rem; letter-spacing:-.06em; }
    footer { display:flex; justify-content:space-between; padding:25px 30px; background:var(--ink); color:var(--paper); font-size:.72rem; }
    @media (max-width:720px) { .page { width:100%; margin:0; } .nav { padding:18px; } .nav-links { display:none; } .hero { min-height:600px; padding:22px 18px; } .hero h1 { font-size:20vw; } .court { inset:170px 0 0 5%; } .hero-note { right:8%; bottom:32px; } .section { padding:55px 18px; } .split,.weekly,.work-card { grid-template-columns:1fr; gap:25px; } .interest-grid,.following-list,.opportunity-grid { grid-template-columns:1fr; } .interest { min-height:180px; border-right:0; border-bottom:1px solid var(--line); } .interest-number { margin-bottom:28px; } footer { padding:22px 18px; } }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="Main navigation"><a class="brand" href="#top">RYAN.</a><div class="nav-links"><a href="#about">ABOUT</a><a href="#interests">INTERESTS</a><a href="#weekly">WEEKLY</a><a href="#opportunities">OPPORTUNITIES</a></div><span>2026</span></nav>
    <section class="hero" id="top" aria-labelledby="hero-title"><div class="eyebrow" id="hero-eyebrow"></div><h1 id="hero-title"></h1><p class="hero-copy" id="hero-copy"></p><div class="court" aria-hidden="true"><div class="ball" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path d="M0 24h48"/><path d="M24 0c8 8 8 40 0 48"/><path d="M24 0c-8 8-8 40 0 48"/><path d="M0 9c14 11 34 11 48 0"/><path d="M0 39c14-11 34-11 48 0"/></svg></div></div><div class="hero-note"><b>ON MY MIND</b>Basketball. Mathematics. One Piece.</div></section>
    <section class="section split" id="about"><div class="section-label">01 / About me</div><div><h2>Three things that keep me curious.</h2><p class="about-copy" id="about-copy"></p></div></section>
    <section class="section" id="interests"><div class="section-label" style="margin-bottom:22px">02 / Interests</div><div class="interest-grid" id="interest-grid"></div></section>
    <section class="section" id="working"><div class="work-card"><div><div class="section-label" id="work-label"></div><h2 id="work-title"></h2></div><p id="work-copy"></p></div></section>
    <section class="section split" id="following"><div class="section-label">03 / Things I follow</div><ul class="following-list" id="following-list"></ul></section>
    <section class="section weekly" id="weekly"><div><div class="section-label" id="weekly-issue"></div><h2 id="weekly-title"></h2></div><p id="weekly-copy"></p></section>
    <section class="section" id="opportunities"><div class="split" style="margin-bottom:38px"><div class="section-label">04 / Opportunities</div><h2>Things I might apply for.</h2></div><div class="opportunity-grid" id="opportunity-grid"></div></section>
    <footer><span>RYAN / PERSONAL SITE</span><span>Keep learning. Keep moving.</span></footer>
  </main>
  <script src="content.js"></script>
  <script>
    const content = window.ryanContent;
    document.title = `${content.name} | Basketball, Mathematics and One Piece`;
    document.querySelector('#hero-eyebrow').textContent = content.hero.eyebrow;
    document.querySelector('#hero-title').innerHTML = content.hero.title.replace(' x ', ' <span>x</span> ');
    document.querySelector('#hero-copy').textContent = content.hero.intro;
    document.querySelector('#about-copy').textContent = content.about;
    const icons = {
      basketball: '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M4 24h40M24 4c8 8 8 32 0 40M24 4c-8 8-8 32 0 40"/><path d="M8 12c10 6 22 6 32 0M8 36c10-6 22-6 32 0"/></svg>',
      mathematics: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 37 22 10l18 27Z"/><circle cx="34" cy="14" r="6"/><path d="M8 42h32M16 29h14"/></svg>',
      voyage: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 27c0-9 4-15 10-15s10 6 10 15"/><path class="hat-band" d="M13 25h22v5H13z"/><path d="M7 31c3-4 9-5 17-5s14 1 17 5c-5 4-11 5-17 5S12 35 7 31Z"/><path d="M12 33c7 2 17 2 24 0"/></svg>'
    };
    document.querySelector('#interest-grid').innerHTML = content.interests.map(item => `<article class="interest"><span class="interest-icon" aria-label="${item.title} icon">${icons[item.icon]}</span><span class="interest-number">${item.number} / INTEREST</span><h3>${item.title}</h3><p>${item.copy}</p></article>`).join('');
    document.querySelector('#work-label').textContent = content.workingOn.label;
    document.querySelector('#work-title').textContent = content.workingOn.title;
    document.querySelector('#work-copy').textContent = content.workingOn.copy;
    document.querySelector('#following-list').innerHTML = content.following.map(item => `<li>${item}</li>`).join('');
    document.querySelector('#weekly-issue').textContent = content.weekly.issue;
    document.querySelector('#weekly-title').textContent = content.weekly.title;
    document.querySelector('#weekly-copy').textContent = content.weekly.copy;
    document.querySelector('#opportunity-grid').innerHTML = content.opportunities.map((item, index) => `<article class="opportunity"><span class="section-label">0${index + 1}</span><h3>${item.title}</h3><p>${item.copy}</p></article>`).join('');
  </script>
</body>
</html>
